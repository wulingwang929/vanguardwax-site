name: KT-V Dori Cordless Brushless Polisher
tagline: Brushless motor delivers steady, constant speed that doesn't bog down under pressure
description: |-
  - Brushless motor delivers steady, constant speed that doesn't bog down under pressure.
  - Five speed settings (2,000–5,000 rpm) with a 3mm orbit for controlled waxing and polishing.
  - Auxiliary handle and rubber-protected battery base for a comfortable, stable grip; built-in LED work light.
  - Cordless 12V lithium power with two 2,000mAh batteries you can swap for uninterrupted work.
  - LCD panel shows remaining battery and speed at a glance; hook-and-loop EVA backing plate in 5" and 4" sizes.
usageSteps:
  - Hook and loop the sponge onto the car waxer & polisher
  - Apply some wax on the sponge
  - Turn on the waxer & polisher ,adjust to the moderate speed,and start to wax.
