safety: |-
  - Please avoid using the cordless waxing machine in hazardous environments and refrain from dropping it to prevent damage.
  - Do not use the cordless waxing machine on the human body.
  - Keep the machine out of reach of children and ensure that they do not touch the rotating pad while the waxing machine is in operation.
  - The waxing machine can be used on car windows, bathroom glass, and marble boards, as well as automotive, motorcycle, and boat body paint.
  - Do not use this product for purposes other than waxing or polishing to avoid damage and loss of warranty.
  - Do not touch the waxing machine with water, and do not wash the machine with water. If the body is dirty, clean it with a slightly damp cloth.
  - Fully charge both batteries before use and alternate to use both batteries to prevent issues caused by low power due to prolonged disuse.
  - When storing the machine in the box after use, please separate the battery from the main body.
  - Do not overcharge the battery for an extended period and try to keep the battery in a charged state. Lithium batteries that are fully discharged and left unused for a long time may become ineffective and unusable.
  - When disposing of the machine, please follow environmentally friendly recycling regulations and do not burn it. Lithium batteries should not be disposed of in regular trash bins and should be recycled as waste dry batteries.
  - Upon receiving the product, inspect all accessories (battery, charger) before use.
  - Please note that there is no trial period. Once the product is unboxed, it is considered sold. Returns or exchanges will not be accepted if stickers are damaged, packaging is broken, or there are signs of use.
  - After registering for the online warranty, the machine body and battery (not caused by personal damage) are covered for one year and three months, respectively.
