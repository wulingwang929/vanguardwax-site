name: CLAY-U Clay Lubricant
tagline: Perfect removal of body paint particles
description: |-
  - Perfect removal of body paint particles
  - Restores paint to smooth
  - A deep cleaning before coating
  - Long-lasting waxing and coating after using the CLAY Lubricant
  - Instead of water, the smoothness & decontamination are upgraded
  - Easy and fast removal of adhesions from car paint
  - Safest and Effective Iron Powder Removal KIT
  - Makes cleaning dirty car paint easier
usageSteps:
  - The car does not need to be dried after washing it thoroughly.
  - Spray the Car CLAY Cleaning Lubricant directly on the body paint or the palm-sized CLAY.
  - Use CLAY Lubricant to reduce friction, and push the palm-sized CLAY back and forth on the car paint surface.
  - After the operation, please rinse it with clean water, and finally dry it with a microfiber cloth.
  - ※It is recommended to operate one part of car paint at a time to prevent the lubricant from drying on the car paint and glass.
specs:
  capacity: 300ml
