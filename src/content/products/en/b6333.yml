safety: |-
  - After use, please clean the palm-sized CLAY, and place it in a cool and ventilated place. Please do not place it in a place with high temperature or direct sunlight.
  - Keep out of reach of children, in case of accidental contact with eyes, rinse with plenty of water and seek medical attention immediately.
  - In case of accidental ingestion, do not induce vomiting, and please seek medical attention immediately.
  - For those who are prone to skin allergies after prolonged use, please wear protective gloves.
  - Do not let the Car CLAY cleaning lubricant dry on the paint surface or glass to avoid stains.
  - Before the operation, please make sure that the car paint and the palm-sized clay are clean. And please do not apply too much force to avoid fine lines on the surface.
  - Do not operate with chemicals containing solvents, such as asphalt remover, iron powder remover, and paint restorer.
  - If the handheld clay has already adhered to the car paint, please do not continue to operate.
