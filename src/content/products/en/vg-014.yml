usageSteps:
  - Spray the wax remover onto the surface of the sponge or cloth and rub to clean.
  - After cleaning thoroughly, rinse with clean water.
  - Directly spray onto pre-cleaned plastic parts and wait a few seconds to wipe clean with a brush or cloth.
  - Alternatively, dilute this product with water in a 1:10 ratio, soak the sponge and cloth for an hour, then rub and wash. Then rinse with water after cleaning.
