description: |-
  - Built on top-grade No. 1 Brazilian carnauba wax for a deep, long-lasting shine.
  - A polymer fiber sealant forms a hard, glossy protective layer with a porcelain-like finish, rated for over 120 days of protection.
  - Strong water beading and dirt resistance help paint stand up to acid rain, sunlight and UV exposure, and fill in fine scratches.
  - Contains no abrasives and leaves no white residue on unpainted black plastic trim.
  - Suitable for all paint colors. 200g jar covers about 10–14 average cars; includes one microfiber cloth.
usageSteps:
  - Wash the car thoroughly and wipe dry
  - Apply some wax on applicator pad ,apply the wax in a circular motion
  - Do one section in a time
  - Use a clean .soft microfiber cloth to wipe the surface to high gloss as in mirror effect.
