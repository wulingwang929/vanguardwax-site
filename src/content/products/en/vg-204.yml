description: |-
  - Precise liquid measurement and acid-alkali resistance.
  - Taiwan patent design(Patent No. D219906).
  - The measuring cup comes with clear markings and can hold up to 100ML.
  - Suitable for dispensing car wash detergent, general-purpose solutions, and other car care chemicals.
  - It can fit 28mm neck containers or commonly available standard bottles.
usageSteps:
  - Tighten the pre-measured solvent bottle’s mouth to the measuring cup.
  - Gently squeeze the solvent bottle to fill the measuring cup up to the desired scale.
  - Open the cup's lid and pour out the measured liquid.
