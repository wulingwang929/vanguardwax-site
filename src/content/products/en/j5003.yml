safety: |-
  - Wash with soap or neutral detergent after several times of use.
  - Do not use softener to avoid damage to fibrous tissue and water absorption.
  - If bleached or used in dryer, there may be some shrinkage.
  - Dry fiber cloth can also be used.
  - Please check if the cloth surface is covered with dust before use.
  - Check the cloth if the surface covers with sand and dust to avoid scratches.
