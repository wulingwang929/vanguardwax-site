usageSteps:
  - Please make sure that the car windshield has been washed before to avoid dust and dirt scratching the glass.
  - Please use it when the glass is slightly wet.
  - Wet the non-woven surface of the degreasing film with water and then attach it to the waxing pad.
  - The windshield after removing the oil film is "completely hydrophilic". If you need the rain hydrophobic effect, please use "rain repellent agent".
