safety: |-
  - Please use and store in a ventilated and cool place.
  - People with skin allergies or long-term users should wear protective gloves for construction.
  - Please use the gentlest operating force.
  - For more defects, please increase the amount of smearing and increase the smearing pressure appropriately to achieve perfect results.
  - Please place it in a place that is difficult for children to reach.
  - Do not induce vomiting if swallowed accidentally, and seek medical attention immediately.
  - Please dispose of it in accordance with the environmental protection recycling classification.
