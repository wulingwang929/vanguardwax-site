name: Brightening Liquid Wax
tagline: Tackles fine swirl marks, old grime and dull, faded paint in one step
description: |-
  - Tackles fine swirl marks, old grime and dull, faded paint in one step.
  - Improves water and oil repellency so dirt sticks less.
  - Smooths paint pores to restore slickness and color depth, and lifts light water spots, oxidation and yellowing.
  - Abrasive-free cleaning agents are safe for clear coat and paint.
  - Helps your protective wax bond better and last longer. 300ml; includes one microfiber cloth.
usageSteps:
  - Wash and dry the whole car thoroughly.
  - Use a sponge to dip the whitening wax and apply it onto the car paint surface.
  - Process one area at a time by overlapping and drawing circles.
  - After the operation is completed, wipe it evenly with a clean cloth. Then the wax can be restored the color and bring brightness of the car.
  - Car paint whitening and brightening texture is upgraded It can be added with a layer of protective wax to protect the car paint for a stacked gloss effect.
