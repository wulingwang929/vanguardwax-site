name: TANK300 Cordless Electric Foam Sprayer
tagline: One-button electric pressurization delivers dense foam instantly — no hand pumping
description: |-
  - One-button electric pressurization delivers dense foam instantly — no hand pumping.
  - Automatically stops when pressure is reached and tops up when it drops.
  - Cordless and rechargeable (USB-C), so it works anywhere with both hands free.
  - Wide filling port for shampoo and water, plus a pressure-release valve for safe opening.
  - 1.5L capacity. Patented in Taiwan (M647786) and China (ZL202222985477.2). Designed in Taiwan, made in China.
usageSteps:
  - Insert the charger plug into the charging socket of the device (the orange indicator light constantly on indicates charging).
  - Once fully charged (green indicator light constantly on), immediately disconnect the charging power.
  - Before opening the cap each time, be sure to press the pressure release valve button to release pressure and ensure there is no gas pressure inside the container.
  - Unscrew the liquid cap counterclockwise.
  - Add water or car shampoo, and finally screw the liquid cap clockwise tightly.
  - Lightly press the power switch to start the inflation motor, and the sprayer enters the inflation and pressurization process.
  - When the pressure inside the sprayer reaches the set pressure value, the inflation motor stops automatically (the blue indicator light is constantly on). When the pressure drops below the set value during use, the inflation motor will automatically start inflating (after multiple uses, if the inflation motor is insufficient, the device needs to be fully charged).
  - Aim the nozzle at the desired spraying position, press the spray button to spray, and adjust the nozzle to set the sector spraying direction. (You can also replace the fogging nozzle).
  - If not in use for three minutes, the machine will automatically shut down. To continue using it, activate the power button again. If you want to shut it down, press the power button to turn it off. (Indicator light goes off).
