safety: |-
  - When operating the device, pay close attention to the indicator lights to understand its working status.
  - Due to the presence of gas pressure inside the device, tighten the cap and water mouth to prevent air leakage. If there is any leakage, check if the sealing ring is loose, deformed, or not tightened properly.
  - The charging voltage for this device is DC5V. Never use a power source with a voltage that does not match for charging. After the battery is fully charged, remove the plug immediately and avoid leaving it in a charging state for an extended period.
  - If the machine continues to pressurize without stopping during use, immediately turn off the power to prevent damage due to excessive pressure.
  - Do not spray toxic or corrosive liquids (such as acid detergents, iron powders, strong acid or alkaline detergents, or flammable liquids).
  - When there is liquid inside the pressure vessel, do not store the machine upside down.
  - Do not allow children to use the device alone. Do not spray on animals or human facial features.
  - After each use, be sure to release the pressure from the machine and empty the liquid from the pressure vessel.
  - Do not charge the battery for a long time and try to keep the battery charged. If a lithium battery is left unused for a long time without charge, it may become ineffective due to low battery levels.
  - If the red light is displayed, it indicates insufficient power or there may be unresolved malfunctions. (Please contact customer service).
  - This product is insured with product liability insurance from The First Insurance Co., Ltd for NT$24 million (the insured amount is not the claim amount).
  - After registering for an online warranty, the motor and battery enjoy a one-year and three-month warranty, respectively, against non-human-induced damages.
