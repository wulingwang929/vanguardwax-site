description: |-
  - Designed for automotive paint finishes and lacquered detailing treatments.
  - The whole series of products are made of imported, high-quality polyester sponge, with excellent tensile strength and durability, and the service life is several times that of ordinary sponge.
  - Using professional bonding technology, it can be cleaned with water and neutral detergent below 60 degrees. After cleaning, wring it out to dry. It is recommended to completely dry the sponge before continuing to use.
  - A variety of sponge specifications are available. You can choose the appropriate sponge according to the working procedure and the matching polishing agent or compound wax to achieve the most perfect polishing effect.
  - It is recommended to use the spin number from 1800 to 3000 rpm. Best to follow the maximum spin number as instructed on the polishing /wax application to ensure that the lacquer is not damaged.
usageSteps:
  - Installed on a waxing machine for use.
  - Universal type, can be used with coarse, medium and fine polishing agents. Remove the lacquer surface and the heavy oxide layer of the paint surface.
