safety: |-
  - Use and store in a well-ventilated and cool place.
  - Wear protective gloves if you have sensitive skin or are using the product for an extended period.
  - Do not induce vomiting if accidentally ingested, and please seek immediate medical attention.
  - Dispose of according to environmental recycling regulations.
  - Keep out of reach of children.
