safety: |-
  - Soak with water before use & avoid using when the surface is dry
  - Please rinse off the sand and dirt on the car body surface with clean water first to avoid scratching the car body
  - If it is too dirty, use a foaming agent such as dishwashing detergent or laundry detergent to strengthen the cleaning after use
  - Do not use softener, bleach, and dryer, so as not to damage the fibrous tissue and affect the water absorption function
  - After washing, please dry completely before use, and avoid prolonged exposure to the sun
  - According to the frequency of car washing, it is recommended to replace it regularly. The replaced car washing gloves can be replaced to wash the dirty bumper and rim.
