name: 365-Day Super Fluorine Water Repellent
tagline: Long-lasting fluorine water repellent that beads water fast
description: |-
  - Long-lasting fluorine water repellent that beads water fast.
  - Keeps the windshield clear in the rain and resists oil film and grime.
  - Wide applicator head for even, effortless coverage.
  - Rated for up to 365 days of protection. 120ml, made in Taiwan.
usageSteps:
  - Remove the grease on windshield and wipe dry.
  - Apply 365 days high sustainability super fluoride water repellent on glass.
  - Wait for 5 minutes to let it dry.
  - Buff off with a clean.soft cloth.
