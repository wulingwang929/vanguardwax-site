safety: |-
  - Shake well before use. Do not apply under direct sunlight or high temperatures.
  - If you have sensitive skin, wear gloves. In case of accidental ingestion or contact with eyes, rinse with plenty of water and seek medical attention immediately.
  - Keep out of reach of children.
