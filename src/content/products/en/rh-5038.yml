description: |-
  - [Exceptional Interior Protection] Combining graphene with a leather-enhancing formula, this product is enriched with natural nourishing oils. Its superconductive properties allow for deep absorption, moisturizing leather and synthetic surfaces while forming a long-lasting protective coating. It remains soft and non-greasy, preserving the natural shine of a brand-new vehicle.
  - [Glossy Finish & UV Protection] Effectively shields your interior surfaces from UV damage, repels dirt, dust, and static, and prevents drying, cracking, and fading—keeping your interior looking as good as new.
  - [Easy Maintenance] Enjoy the satisfaction of self-maintenance. The long-lasting formula reduces the need for frequent applications, ensuring your interior stays spotless with minimal effort.
usageSteps:
  - Clean the area to be treated before application.
  - Simply spray onto leather surfaces, wipe evenly with a microfiber cloth, and allow to dry for 10 minutes.
  - For perforated leather, spray onto a microfiber cloth first before wiping.
