name: 12-Month Nano Fluorine Glass Coating
tagline: Nano Fluorine Coating combined with special self-cleaning coating agent
description: |-
  - Nano Fluorine Coating combined with special self-cleaning coating agent
  - a pure fluorine bonded layer formed by using chemical reaction which enables water repellent effect up to 12 months.
  - Precise bonded layer can prevent external factors affecting the effect of water repellent.
  - It keeps clear visual presentation and improve the transparency of the glass.
  - No glare during night drive and prevent dust to be adhered.
usageSteps:
  - Wash the glass thoroughly and wipe dry.
  - Apply some tube A on applicator pad, and apply it up and down then side to side
  - Use a clean and soft microfiber cloth to wipe the surface to high gloss as in mirror effect.
  - Wait for 10 minutes
  - Apply some tube B on applicator pad, and apply it up and down then side to side
  - Wait for 10 minutes to complete the coating process.
