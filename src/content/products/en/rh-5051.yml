name: Super Protection Graphene Glass Water-Repellent Coating
tagline: "[Powerful Water Repellency, Water beads Fly Off]Formulated with graphene and fluorosilane compounds, this"
description: |-
  - [Powerful Water Repellency, Water beads Fly Off]Formulated with graphene and fluorosilane compounds, this advanced solution effectively fills microscopic pores in glass surfaces, creating a durable protective layer. It delivers exceptional water repellency, stain resistance, and prevent grime.
  - [Invisible Wiper Effect]With an ultra-high 110º water contact angle, water beads effortlessly roll off the windshield at speeds above 45 km/h, ensuring clear visibility and safe driving in rainy conditions.
  - [Convenient & Easy Application]Equipped with an ergonomic brush head for effortless and even application, ensuring quick and complete coverage. The formula does not come into direct contact with hands, making the process safer and more user-friendly.
usageSteps:
  - Thoroughly remove oil film from the windshield and dry the surface.
  - Gently press the bottle to soak the brush head with the solution, then apply the graphene water-repellent coating evenly onto the glass.
  - Wait for the solution to dry into a white haze, forming a molecular bonding structure.
  - Wipe off with a wrung-out microfiber cloth until the windshield becomes clear and transparent.
specs:
  capacity: 100ml
  origin: Taiwan
  ingredients: Nano Liquid Graphene, Special Fluorine Compounds, High-Polymer Fluorosilane Compounds, IPA Alcohols
safety: |-
  - To remove this product, use a powerful glass-specific oil film remover.
  - Do not store the bottle upside down or on its side. Ensure the cap is tightly sealed after use to prevent leakage.
  - Do not apply the product under direct sunlight or in high-temperature environments.
  - If you have sensitive skin, wear gloves. In case of accidental ingestion or contact with eyes, rinse thoroughly with plenty of water and seek immediate medical attention.
