safety: |-
  - Do not use plastic parts and unpainted bumpers, rubber, leather, glass, etc.
  - Keep away from flammable materials and do not use them near a heat source or in places with temperatures above 40°C.
  - Keep out of reach of children and please do not ingest.
  - Avoid standing in downwind to prevent accidental contact with the body when spraying.
  - Prohibited for use on acrylic plastic headlights and taillights.
  - Please dispose of it according to the environmental recycling regulations.
