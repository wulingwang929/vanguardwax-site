name: Tar & Bug Remover
tagline: Powerful, fast, and instantly clean!
description: |-
  - Powerful, fast, and instantly clean!
  - Ultra-fine mist can easily remove tar and various oily grime on the car body and bumpers.
  - Silicon protection formula cleans while effectively protecting the car paint and maintaining the body's shine.
  - Can also be used as an adhesive remover for sticker residues.
  - Suitable for all car colors and convenient to use.
usageSteps:
  - After washing the car body, spray directly on the surface to be treated. Wait a few seconds for the tar to dissolve, then wipe it off with a clean cloth.
  - For large areas with stubborn tar stains, please repeat the process until completely removed.
