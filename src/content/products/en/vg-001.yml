name: Purple Reaction Iron Remover for Wheels
tagline: Powerful removal of iron powder on the tire rim and brake dust
description: |-
  - Powerful removal of iron powder on the tire rim and brake dust.
  - Quick response and no damage to the rim.
  - After the purple burst effect occurs, it can be washed with a strong water jet.
  - Especially for stubborn iron powder.
  - Remove brake dust.
  - Quickly dissolve dirty rim.
  - Stubborn dirt is all out.
usageSteps:
  - When using it for the first time, it is recommended to test small blocks first.
  - Can be sprayed directly when the wheel is dry.
  - After standing for 1-3 minutes, the agent color from transparent to purple.
  - Immediately rinse with a high-pressure water jet.
  - Normal foam car wash.
  - Can be used with Detailing Brush / Wire Rod to enhance detail cleaning.
  - Thoroughly clean the surface of the tire rim to keep the wheel discs as shiny as new.
  - 【SCOPE OF APPLICATION】Wheels & Discs
specs:
  capacity: 750ml
  origin: Taiwan - KYOEI Chemical Laboratory
  ingredients: Refined Water, Rust Oxidizer, Discoloration Indicator, Surfactant
  other:
    - "Shelf Life: 6 years"
safety: |-
  - Keep out of the reach of children.
  - Do not spray directly on people and animals.
  - Please wear a mask when using, the smell will cause discomfort to the respiratory system.
  - Please wear gloves when using, direct contact with the skin may cause burns and allergies.
  - In case of accidental contact, please rinse with plenty of water, if there is no improvement, please seek medical attention immediately.
  - Please test and use it in a small area first to confirm that there is no adverse reaction, and then do a large-scale construction.
