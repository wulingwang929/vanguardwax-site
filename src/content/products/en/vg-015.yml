tagline: Glaze-wax sealing technology with a polymer glaze formula that penetrates paint pores to form a protective
description: |-
  - Glaze-wax sealing technology with a polymer glaze formula that penetrates paint pores to form a protective film.
  - Helps remove light scratches, fine lines and swirl marks.
  - Wash-resistant, UV-resistant and anti-oxidation to prevent fading.
  - Restores a smooth, level surface with a mirror-like finish. 200g; shelf life 10 years.
usageSteps:
  - Thoroughly clean and dry the vehicle's exterior.
  - Apply a small amount of wax onto the dedicated applicator sponge then evenly coat the car body in a circular motion.
  - Use a clean and soft microfiber cloth to wipe and achieve a shiny, mirror-like effect.
  - In high-temperature environments, maintain the metal surface in a cool state for easier application.
  - When the sheet metal temperature is high, wax one section at a time and apply wax to another section after waxing to prevent excessive drying.
