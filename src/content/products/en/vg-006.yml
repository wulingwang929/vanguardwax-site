name: Super Fluorine Glass Coating Wipe
tagline: Advanced Super Fluorine Technology
description: |-
  - Advanced Super Fluorine Technology.
  - Fill the windshield with a clear water repellent coating.
  - Twice the amount of Polymer Fluorine Formula.
  - The raindrops have gone immediately.
  - Easy to carry for our Coating Towel.
  - Wet tissue style & Easy for operating on any corners of the glass.
  - Don’t be afraid of cross-contamination when using for individual packaging!
  - Total operation JUST need less than 10 minutes to be done.
usageSteps:
  - First, remove the oil film from the windshield thoroughly and dry it completely.
  - Use our ‘VANGUARD Glass Oil Film Remover’ and make sure the oil film on the glass is properly removed, then tear off our ‘Super FUSSO Glass Coating Towel’ Immediately.
  - After that, apply the Glass Coating Towel on the glass evenly on the windshield in a straight line back and forth.
  - Let the Super FUSSO Water Repellent Towel dry about 5 minutes, and the molecular structure of the Water Repellent coating can be completed.
  - Finally, wipe with a wrung microfiber cloth to make the windshield clear and complete.
  - 【USAGE ESTIMATION】The Super FUSSO Glass Coating Towel can only be used ONLY once, and cannot be used after the coating towel is dried. The actual use is mainly based on the current operation due to the size and application speed of each windshield.
specs:
  capacity: 200 x 230 mm
  origin: "Taiwan: KYOEI Chemical Laboratory"
  dimensions: 200x230mm
  ingredients: IPA alcohols, Special FUSSO, High Molecular Fluoro-silane Compounds
  other:
    - "Shelf life: 6 years"
safety: |-
  - People with skin allergies or long-term users should wear protective gloves for construction.
  - If swallowed accidentally, please seek medical attention immediately.
  - Keep out of reach of children, in case of accidental contact with eyes, rinse with plenty of water and seek medical attention immediately.
  - For glass only, please use it on surfaces other than glass.
  - Do not operate in direct sunlight or high temperature.
  - To remove the effect of this product, please use a special abrasive for glass.
  - Due to the different conditions of each vehicle and the individual dosage, the effect should be based on the actual operation.
