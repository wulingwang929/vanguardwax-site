name: High-Pressure Water Spray Gun
tagline: Six-stage sprinkler mode can effectively clean various environments
description: |-
  - Six-stage sprinkler mode can effectively clean various environments. Good grip ergonomic handle design.
  - The rubber cover of the water gun head can effectively protect the nozzle and prevent slipping.
  - Press the water trigger to continuously discharge water, and press the release button to cut off the water.
  - Equipped with a backstop quick connector, the water gun can automatically cut off the water without turning off the water when it is replaced and pulled out.
  - Different quick connectors can be freely connected.
  - 20 cm adjustable compression tube, which can be flexibly stretched in various scenes.
  - Equipped with detergent reservoir, and easy to achieve saponification & clean water mode by switching the mode.
usageSteps:
  - Start the sprinkler with barrel extending to the longest position.
  - Pour the cleaning agent into the cleaning reservoir.
  - Connect the backstop quick connector and fix it directly on the bottom of the water gun nozzle.
  - Before adding detergent, be sure to add when the detergent/water switch is at "water level".
  - Rotate the sprinkler to the desired sprinkler mode position, there is an indicator arrow on the top of the sprinkler to understand the sprinkler mode change.
  - The water gun can spray water or mixed detergent spray, which can be changed by the switch on the top of the gun body.
  - The switch of the water gun must be pressed and the trigger can be used when you hear a "click" sound (continuous water out). When you want to stop the water, just press the gray button to release the trigger, and the water will stop.
  - It can be used with a sponge and a water jet, which will have a bonus effect on cleaning dust and dirt.
  - To clean the detergent reservoir, unscrew the reservoir and fill with water then simply spray water until no foam.
  - Avoid placing this product in direct sunlight for a long time.
  - After use, push the water pipe back to its original position and remove the quick connector, turn the rotating nozzle to the ground, do not point the nozzle at the face or other people, and finally the liquid in the tank will disperse.
