safety: |-
  - When the water column is used strongly, it is forbidden to aim the water gun at anyone and the eyes.
  - The water gun is not a toy and is not suitable for use as a toy or for other purposes, nor is it suitable for children to use alone.
  - Do not place the car wash water gun in direct sunlight for a long time.
  - Regularly clean the nozzle holes to remove any debris. Be sure to clean the detergent reservoir with water after each use.
  - Before adding the detergent, please read the safety label of the detergent before pouring it into the water gun mixing tank for use.
  - Do not use toxic chemicals or corrosive liquids in the water gun.
  - The car wash can only be operated with cold water.
  - Do not throw directly at people to avoid injury.
  - When discarding, please recycle according to environmental recycling regulations. Please do not burn.
  - If you use it for other purposes, please carefully evaluate the safety.
  - This package does not contain (water pipe) and (connector on the faucet end) and (faucet adapter).
