tagline: The wool polishing disc is specially designed for the ultra-lacquer mirror finishing detailing treatment
description: "- The wool polishing disc is specially designed for the ultra-lacquer mirror finishing detailing treatment. Made of fine wool, which is efficient to use with soft and smooth texture. Will not scratch the surface of the object during polishing."
usageSteps:
  - Soak the wool polishing disc and install it on the grinder. Spin for 5 seconds to remove excess water.
  - Shake the abrasive and pour some on the wool polishing disc. Spread it evenly on the paint surface with a polishing disc.
  - For the corner details of the car, please use manual method to polish, clean with a fiber cloth. Pay attention to the corners and edges. Do not use too much force for polishing as some surface may be thin.
  - After polishing, clean the car with a fresh towel.
