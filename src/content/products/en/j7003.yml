safety: |-
  - Please wash it with soap or neutral detergent after several time use.
  - Do not use softener to avoid damage to fibrous tissue and affect water absorption.
  - If bleach or dryer is used, there may be some shrinkage.
  - Remove sand and dust covered on cloth before use to avoid scratches.
