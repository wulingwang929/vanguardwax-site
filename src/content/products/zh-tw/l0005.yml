description: |-
  - 無碳刷馬達搭載穩定恆速輸出，壓機不停機，施工更高效
  - 五段可調轉速，依需求自由調整，打蠟拋光精準掌控
  - 輔助握把與電池底部橡膠防護，減少操作負擔，手感更穩定
  - LED照明燈清晰照亮施工範圍，確保每個細節完美呈現
  - 12V大功率鋰電池供電，無線操作無拘束，續航更強更穩定
  - 2顆2000mAh大容量電池交替使用，使用不間斷
  - 液晶面板使用更直覺，剩餘電量/轉速一目瞭然
  - EVA魔鬼氈緩衝盤設計，可穩固貼合海綿盤，順暢服貼
usageSteps:
  - 將海綿黏扣至打蠟機上。
  - 於海綿上均勻塗抹蠟品。
  - 開啟開關並調整到適合的轉速即可開始打蠟。
