safety: |-
  - 請避免在危險環境下使用無線打蠟機，且勿重摔機器避免造成損壞。
  - 請勿將無線打蠟機使用於人體上。
  - 使用時請遠離孩童，並勿讓孩童觸碰正在運作的打蠟機轉盤。
  - 打蠟機可用於汽車玻璃、浴室玻璃、大理石桌板與汽車、機車、船舶等板金烤漆上。
  - 請勿將打蠟機用於打蠟拋光以外的用途，以免損壞機器及保固權益。
  - 打蠟機不可碰水，不可水洗機器，如果機身有髒汙可用微濕毛巾擦拭乾淨。
  - 使用前請先將2顆電池充電至滿電狀態，操作時並交替使用，以避免鋰電池長時間未使用而電量過低造成異常。
  - 使用完畢存放於盒內時，請將電池與本體分開放置。
  - 電池請勿長時間充電且盡量將電池保持在有電的狀態。鋰電池若沒電，又長時間放置無使用、會導致鋰電池因為電量過低而失效不能再使用。
  - 丟棄時請按環保回收規範回收，請勿燃燒。鋰電池請勿丟棄於垃圾桶內，屬廢乾電池回收範圍。
  - 收到商品請先檢查內部配件(電池、充電座)是否正常，再開始使用商品。
  - 提醒您，鑑賞期非試用期，商品一經拆封視同購買，貼紙毀損、包裝破壞，商品明顯使用痕跡等原因，恕不接受申請退換貨，敬請配合。
  - 註冊線上保固後，機器本體、充電電池非人為因素損壞享一年與三個月保固。
