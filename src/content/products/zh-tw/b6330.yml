name: 可力優 魔泥磁土潤滑組
tagline: 創新研發NANO水次元凝膠技術，沾水擦拭時將不斷釋放奈米因子
description: |-
  - 創新研發NANO水次元凝膠技術，沾水擦拭時將不斷釋放奈米因子，可大幅減緩與車漆之間的磨擦。
  - 專為您愛車的烤漆深層清潔設計，恢復順手的平滑感。
  - 搭配潤滑清潔液使用，輕鬆簡單就將車漆上附著物去除。
  - 耐用性高於美容黏土3倍。
usageSteps:
  - 先將車身上的泥沙、灰塵洗淨，洗淨後不用擦乾車身。
  - 將魔泥清潔潤滑液噴灑在車身烤漆或掌上型魔泥磁土上。
  - 利用潤滑液降低摩擦，將掌上型魔泥磁土在車漆表面來回輕推。(建議一次操作一片烤漆或玻璃，以免潤滑液乾燥在烤漆與玻璃上)
  - 推完後用手觸摸，感受一下是否還有明顯顆粒。(如還有顆粒感請重複步驟2和3，直到車漆光滑平順)
  - 操作完畢後用清水沖洗乾淨，再用乾淨的超細纖維布擦乾即可。
specs:
  capacity: 200ml
  origin: 台灣
  boxQty: 12
  other:
    - 品名：可力優魔泥磁土潤滑組
    - 掌上型魔泥磁土成分：奈米聚合膠、奈米碳粉、海綿
    - 魔泥清潔潤滑液成分：陰離子表面活性劑、非離子表面活性劑、甘油、香料、純水
    - 保存期限：6年
safety: |-
  - 使用後請將掌上型魔泥磁土清潔乾淨，並放置於陰涼通風處，勿放置於高溫或陽光直射處。
  - 請避免兒童接觸，若不慎接觸到眼睛，請以大量清水沖洗並立即就醫。
  - 不慎誤食者請勿催吐，並立即就醫。
  - 長時間使用與皮膚容易過敏者，使用時請戴保護手套。
  - 請勿讓魔泥清潔潤滑液乾燥於烤漆或玻璃上，以免產生污痕。
  - 操作前請務必確認漆面及掌上型魔泥磁土的乾淨，勿施力過大以免產生細紋。
  - 請勿與含有溶劑類的化工品一起操作，如柏油去除劑、鐵粉去除劑與漆面還原劑。
  - 若掌上型魔泥磁土已會沾附於車漆上，請勿再繼續操作。
