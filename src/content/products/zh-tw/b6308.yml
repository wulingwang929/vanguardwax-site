name: 可力優 魔泥磁土不離手
tagline: 創新研發NANO水次元凝膠技術，沾水擦拭時將不斷釋放奈米因子
description: |-
  - 創新研發NANO水次元凝膠技術，沾水擦拭時將不斷釋放奈米因子，可大幅減緩與車漆之間的磨擦。
  - 用更快速的方式輕易的去除頑固的污粒、鐵粉、工業落塵、車漆粗糙。
  - 面積大、速度快，不可思議的清潔效果。
  - 可取代以往使用粗蠟研磨劑或傳統美容磁土的不便利。
  - 榮獲發明金牌獎，擁有多國專利，全程台灣製造。
usageSteps:
  - 將車身上的灰塵、泥沙徹底洗淨，不須擦乾。
  - 將CLAY-U 磁土不離手用清水或洗車液充分浸濕，不需費力的推抹全車(包括玻璃)。
  - 使用中隨時將CLAY-U 磁土不離手浸濕，過水洗滌後繼續使用，可避免污粒刮傷漆面。
  - 全車推抹乾淨後，再用清水將車身沖洗一遍即可。
  - 若有不正常擦傷或白斑，上蠟後即可消除。
  - 車身擦拭乾淨後，可進行上蠟作業。
specs:
  origin: 台灣
  boxQty: 24
  dimensions: 直徑12cm
  ingredients: 奈米聚合膠、奈米碳粉、天然絲、超細纖維布
  other:
    - 品名：可力優魔泥磁土不離手
    - 有效期限：置陰涼處可永久保存
safety: |-
  - 嚴禁與石油系清潔劑混合使用(如柏油清潔劑或美容乳蠟)。
  - 請勿過度用力擦拭車漆表面，容易產生擦痕。
  - 如已產生擦痕，請上美容細蠟即可消除。
  - 嚴禁長時間置於40℃以上高溫處。
  - 避免在鈑金處於高溫下施工。
  - 膠面嚴重污染髒污，請立即更換新品，以免刮傷車漆。
  - 使用後擰乾，放置於專用泡殼收納。
