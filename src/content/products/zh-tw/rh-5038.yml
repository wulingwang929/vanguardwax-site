name: 超級防護 石墨烯皮革&儀錶板護膜劑
tagline: 【無與倫比的內裝保護】石墨烯結合皮革柔亮配方，添加天然滋養油脂
description: |-
  - 【無與倫比的內裝保護】石墨烯結合皮革柔亮配方，添加天然滋養油脂，超導特性容易吸收滋潤皮革及塑皮件深層養護形成長效持久的護膜層，柔軟不油膩，保持新車般的自然光澤。
  - 【柔亮光澤、防紫外線】有效保護您的內裝表面，抵禦紫外線傷害，抗汙防塵及靜電，預防乾燥龜裂色澤永保如新。
  - 【輕鬆維護】享受自我清潔保養的成就感，長效配方減少頻繁的塗抹，讓您的内裝保持一塵不染。
usageSteps:
  - 使用前先將要保養的部位清洗乾淨。
  - 僅需噴在皮件表面，再用超細纖維布擦拭均勻，待10分鐘乾燥即可。
  - 對於針孔狀皮革，請先噴在超細纖維布上，再行擦拭。
specs:
  capacity: 473ml
  origin: 台灣
  ingredients: 奈米石墨烯、高分子矽氧烷、天然油脂、表面活性劑、滲透劑、香精
safety: |-
  - 使用前先搖勻，請勿在烈日高溫下施工操作。
  - 皮膚敏感者請戴手套，不慎入口、眼請用大量清水沖洗並立即就醫。
  - 請存放於兒童不易拿取之處。
