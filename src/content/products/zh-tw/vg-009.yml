category: car-wash
brand: VANGUARD
name: 柏油蟲斑去除劑
tagline: 強力、快速、瞬間潔淨
description: |-
  - 強力、快速、瞬間潔淨
  - 極細噴霧，輕鬆去除車身和保險桿上的柏油、焦油以及各種油性汙垢
  - 矽保護配方，清潔同時有效保護車漆及維持車身光澤
  - 亦可當去除貼紙殘膠的去黏劑使用
  - 不限車色使用方便
usageSteps:
  - 洗淨車身後，直接噴於欲處理之表面，等候數秒柏油溶解後，再用乾淨的擦車巾擦淨即可。
  - 大面積不易去除的柏油請重複操作，直到完全清除。
specs:
  capacity: 450ml
  origin: 臺灣
  ingredients: 溶劑、矽油、界面活性劑等
  other:
    - 保存期限：6年
safety: |-
  - 不能用於塑料部件及未塗裝的保險桿、橡膠、皮革、玻璃等處。
  - 易燃物品請不要在火源附近使用，勿放置高溫日照40℃以上，不可放置火源易燃處。
  - 請置於兒童不易拿取之處；請勿食用。
  - 噴灑時請注意不要站在下風處，以免誤觸身體。
  - 禁止使用於壓克力塑膠材料大燈及尾燈。
  - 請按照環保回收分類丟棄。
