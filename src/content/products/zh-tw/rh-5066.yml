name: 無機9H結晶體鍍膜 玻璃用 50ml
tagline: 無機硅含量高：成膜物中無機硅含量達76%以上，成膜效率高，膜層強度高
description: |-
  - 無機硅含量高：成膜物中無機硅含量達76%以上，成膜效率高，膜層強度高。
  - 硬度高：成膜物硬度可達7-9H實現有效物理保護，可抵禦外力對烤漆的損害。
  - 亮度高：成膜物無色透明，晶瑩剔透，膜層表面光亮平滑，有一定覆蓋能力，可充分體現漆面的光亮，又不會產生衍射。
  - 安全：本產品配方設計時就考慮到施工安全，膜層不會龜裂，固化過程前慢後快，比同類產品固化慢，更易擦拭乾淨，但固化時間受溫度及溼度影響，所以施工前請先在漆面小範圍實驗後決定擦拭時間，擦拭後2個小時內不要碰水，膜層徹底固化大約2天左右，所以請一週後再洗車(理論為一週，實際2天後洗車也不會有大問題，但盡量避免)。附氣溫與擦拭間隔時間對照表。
  - 撥水性強：成膜物含氟素能使表面張力極低，接觸角(水珠球面切線與平面夾角)最大可達120°，平均在110°，荷葉效果明顯。鍍晶後就能產生荷葉效果並逐漸增強，2個小時後效果更顯著。
  - 穩定性強：成膜物化學穩定性極強，甚至不溶於強酸強鹼和有機溶劑，可抵禦幾乎所有化學腐蝕，更可抵禦如氧化、酸雨、紫外線、油脂、鳥糞等道路汙染。
  - 時效長：由於膜層穩定，不會發生化學損耗，膜層會長期存在，約3年以上，但體現潑水性的氟素部分會損耗，所以強力潑水性能約能維持6個月，一般撥水性能仍存在，故請每6個月進行維護，以加強潑水性。
  - 備註
  - 漆面、擋風玻璃、外觀塑件可依部位單獨使用。
  - 三款鍍膜劑皆可單獨使用，也可組合使用，外觀塑件、車漆成膜後再用玻璃用鍍膜覆蓋成膜，這樣膜層既有厚度又有較強且驚人的潑水性。
  - 玻璃鍍膜也可以做為SiO2 Fluoro結晶體維護劑使用。
usageSteps:
  - 洗車：將車輛徹底清洗乾淨。
  - 去污：用去污劑將漆面柏油和污垢清除。
  - 去鐵粉：用鐵粉去除劑溶解漆面部分鐵粉後沖洗乾淨，再用魔泥磁土將漆面顆粒徹底去除並清洗車輛。
  - 拋光：將漆面拋光，建議使用鏡面拋光劑將漆面拋亮。若無去污劑和鐵粉去除劑等藥劑和工具，可以直接拋光，但應按拋光粗、中、細的順序依次對漆面進行拋光。
  - 脫脂：用脫脂劑將油漆表面的殘留拋光劑等脂類和有機矽類物質清除乾淨。若無脫脂劑直接鍍膜也可以，但鍍膜壽命可能會減短。
  - 鍍膜：先將鍍膜劑滴5滴左右於鍍膜海綿表面，塗於漆面40CM*40CM左右的範圍，以井字工法塗佈施工，完成後等待一段時間，再用毛巾將漆面擦亮，擦拭時可能有輕微阻力感產生(阻力不宜過大及等待時間不宜過長)。記住此時間的長短，全車可按此時間依序由前至後，從上到下進行鍍膜施工。
  - 檢查：認真檢查全車漆面，以免有殘留鍍膜劑固化後影響外觀。
  - 等待：施工完成後，須將車輛在室內停放2-3小時後方可移動，期間不宜沾水、觸碰。
  - SiO2 Fluoro結晶鍍膜劑固化時間指導：
  - SiO2 Fluoro結晶鍍膜劑的固化速度與溫度和溼度成正向關係，即溫度及溼度愈高，固化愈快、愈短。
  - 固化時間，是指將SiO2 Fluoro結晶鍍膜劑塗抹到車漆表面，至鍍晶劑表面開始乾燥的時間。 ※配合烤燈或加熱設備可縮短成膜施工時間。這時用毛巾擦會產生阻力感，遇到這種情況時需盡快將鍍晶劑擦乾淨。
  - 固化超時對烤漆的傷害很大，會導致鍍晶劑過於乾燥，無法用毛巾擦掉而使漆面失去光澤。甚至無法用拋光機去除，最後只能用水磨砂紙打磨去除。所以施工時最好分區分塊進行。
