brand: VANGUARD
name: 紫爆效應鐵粉清除劑 (鋼圈用)
tagline: 強效去除輪圈鐵粉及煞車粉塵
description: |-
  - 強效去除輪圈鐵粉及煞車粉塵
  - 反應迅速且不傷輪圈
  - 紫爆效應產生後，即可用強力水柱沖洗
  - 專門對付頑固鐵粉
  - 消除煞車粉塵
  - 快速溶解輪圈髒污
  - 頑固髒污全都Out
usageSteps:
  - 第一次使用時建議先小區塊測試。
  - 鋼圈乾燥時可直接噴灑。
  - 靜置1-3分鐘產生紫色變化後。
  - 立即用高壓水柱沖洗乾淨。
  - 即可正常泡沫洗車。
  - 可搭配 細節刷 / 鋼圈棒 加強細部清潔。
  - 徹底清潔輪圈表面，使鋼圈碟盤光亮如新。
  - 【適用範圍】輪圈、碟盤
specs:
  capacity: 750ml
  origin: 臺灣-KYOEI化學實驗室
  ingredients: 精鍊水、鐵銹氧化劑、變色指示劑、介面活性劑
  other:
    - 保存期限：6年
safety: |-
  - 請勿置放於兒童易拿取之處。
  - 切勿直接對人及動物嘻戲噴灑。
  - 使用時請配戴口罩，氣味會導致呼吸系統的不適。
  - 使用時請配戴手套，直接接觸皮膚可能會產生灼傷過敏等現象。
  - 若不慎接觸時，請用大量清水沖洗，如無改善請即刻就醫。
  - 請先小區域測試使用，確認無不良反應後再做大面積施工。
