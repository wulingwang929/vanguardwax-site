safety: |-
  - 操作本機請明確注意指示燈顯示工作狀態。
  - 因本機內存有氣體壓力，壺蓋及加液口需擰緊以免漏氣，若有漏氣現象，請檢查密封圈是否鬆脫變形或未擰緊。
  - 本機充電電壓為DC5V，絕不能使用與其電壓不符的電源進行充電；電池充滿後請立即卸除插頭，不要長時間處在充電狀態中。
  - 使用過程中如發現機器一直加壓不會停止，應立刻關閉電源，以免壓力過大造成機器損壞。
  - 禁止使用有毒和有腐触性的液體進行噴灑作業（如酸洗劑、鐵粉劑、強酸鹼洗劑、易燃液體）。
  - 壓力壺內存有液體時，禁將本機器倒置存放。
  - 請勿讓兒童獨自使用本機器；勿對動物及人類五官進行噴射。
  - 每次使用完，請務必將機器洩壓，並清空壓力及壺內的液體。
  - 電池請勿長時間充電且盡量將電池保持在有電的狀態。鋰電池若沒電，又長時間放置無使用、會導致鋰電池因為電量過低而失效不能再使用。
  - 顯示（紅燈）時表示電力不足或可能有故障未排除。（請洽客服）
  - 本產品已投保第一產物保險公司產品責任險新台幣2400萬元（保險金額非為理賠金額）。
  - 註冊線上保固後，馬達、電池非人為因素損壞享一年與三個月保固。
