name: TANK300 坦克電動持壓式泡沫噴壺
tagline: 一鍵自動加壓打氣，只需一按，立刻噴灑濃密泡沫
description: |-
  - 一鍵自動加壓打氣，只需一按，立刻噴灑濃密泡沫
  - 壓力充足會自動停止，壓力不足時會自動加壓
  - 不受場地限制，讓「電動+無線」泡沫噴壺解放雙手
  - 加液口設計，方便添加洗車精與清水
  - 洩壓閥設計，使用完噴壺後按壓洩壓閥洩壓以防安全(開蓋時請洩壓)
  - 中華民國專利號：M647786號
  - 中國專利號：ZL202222985477.2號
usageSteps:
  - 將充電器的插頭插入本機的充電插口（橘色指示燈恆亮）表示充電中。
  - 充滿後顯示（綠色指示燈恆亮），並立即卸除充電電源。
  - 每次開蓋前，務必要按壓卸壓閥鈕進行洩壓動作，並確認容器內無氣體壓力。
  - 先將加液蓋逆時針旋開。
  - 即可添加清水或清洗液，最後順時針方向旋緊加液蓋。
  - 輕按啟動電源開關驅動充氣馬達，噴壺進入充氣加壓工作。
  - 噴壺內壓力達到設定壓力值後，充氣馬達自動停止（藍色指示燈恆亮），使用中壓力下降低於壓力值時，充氣馬達會自動啟動充氣（多次使用後，如果出現充氣馬達力度不足時，則需對本機充電至滿電）。
  - 將噴嘴對準所需噴灑位位置，按下噴射鍵進行噴灑，可調節噴嘴設定扇型噴射方向。（亦可更換噴霧狀噴嘴）。
  - 三分鐘不使用，機器會自動關機，如欲使用請再次啟用電源鍵，如確定關機，請按電源鍵關閉。（指示燈熄滅）
specs:
  origin: 台灣設計，中國製造
  dimensions: 6x15.5x25cm
  other:
    - 内容物：電動泡沫噴壺x1，扇泡噴嘴x2(其一是備品)，霧狀噴嘴x1，(備品)矽膠氣泵手把墊圈x1，(備品)矽膠加液蓋口墊圈x1，Type-C充電線x1，USB充電器x1
    - 噴壺尺寸：6*15.5*25cm
