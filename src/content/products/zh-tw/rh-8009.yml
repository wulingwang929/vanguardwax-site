safety: |-
  - 避免在車身及鈑金零件溫度過高或在太陽直射下使用。
  - 不能使用於塑件部分及沒有烤漆覆蓋的保險桿、橡膠、皮革和玻璃等地方。
  - 避免上蠟時傷害車漆，務必注意先將車身徹底沖洗乾淨。
  - 本蠟品請勿放置於陽光直射處或40度以上之高溫。
  - 不慎誤食，請立即送醫。
  - 請避免兒童接觸，若不慎接觸到眼睛，請以大量清水沖洗並立即就醫。
