tagline: 源自日本超人氣氟素抗汙防撥水專利配方，任何車色皆可使用
description: |-
  - 源自日本超人氣氟素抗汙防撥水專利配方，任何車色皆可使用。
  - 最高等級巴西1號棕櫚蠟，漆面滑順度超提升，水珠飽滿不惹塵。
  - 獨特UV紫外線吸收劑，徹底阻斷紫外線照射並延緩車漆變質劣化。
  - 120天超持久鏡面保護效果，防止灰塵、髒污、油膜與蟲屍等附著。
usageSteps:
  - 使用前應先將附著於車身之灰塵、砂石等徹底沖洗乾淨，並用合成羚羊皮巾將車身剩餘水份完全擦乾。
  - 使用附贈的上蠟海綿沾取少量的獅爵蠟，以畫圓或與車輛行進的相同方向做直線塗佈上蠟。
  - 用乾淨的超細纖維布，將剛剛的蠟擦拭光亮呈鏡面效果。
  - 一次操作一塊鈑金的範圍即可，下完蠟後再繼續操作下一面，以免過度乾燥不好下蠟。
  - 打蠟前鈑金需保持冷卻或較低溫度的狀態，以便後續操作更容易。
