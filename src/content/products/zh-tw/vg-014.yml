safety: |-
  - 請在通風陰涼處使用與存放。
  - 皮膚過敏者或長時間使用者請戴保護手套。
  - 不慎誤食不要催吐，並立即就醫。
  - 請按照環保回收分類丟棄。
  - 特殊材質請先測試，如無問題再行使用。
