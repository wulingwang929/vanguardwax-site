name: 潔淨除蠟劑 (洗蠟精/除蠟水)
tagline: 滲透除蠟配方2
description: |-
  - 滲透除蠟配方2.5倍濃縮
  - 深層蠟脂輕鬆除去
  - 獨家專業配方潔淨除蠟，非溶劑類(IPA)成份
  - 只需簡單搓揉或浸泡
  - 即可快速去除海綿及擦拭布的上殘蠟及油污
usageSteps:
  - 將潔淨除蠟劑噴灑於海綿或布表面進行搓揉清潔。
  - 徹底清洗完畢後，再用清水沖洗乾淨即可。
  - 直接噴灑於預清潔的塑膠件上等待數秒直接用毛刷或布擦拭乾淨即可。
  - 亦或是將本品與水以1:10之比例稀釋，將海綿與布浸泡一小時後並進行搓洗，清洗完畢後，再用清水沖洗乾淨即可。
specs:
