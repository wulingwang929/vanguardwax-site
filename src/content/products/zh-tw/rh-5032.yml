category: glass-care
brand: VANGUARD
name: 爆撥雨高分子氟矽撥水劑
tagline: 精煉氟矽烷，提升八倍撥水性
description: |-
  - 精煉氟矽烷，提升八倍撥水性。
  - 強效防撥水，快速形成撥水膜。
  - 省力大刷頭，施工容易不髒手。
  - 雨刷免刷拭，開車視線超清晰。
  - 堅固撥雨層，120天強勁撥水。
usageSteps:
  - 將擋風玻璃油膜清除乾淨後並擦乾。
  - 輕壓瓶身讓藥劑浸濕刷頭，再將高分子氟矽撥水劑均勻塗佈在玻璃上。
  - 約五分鐘後，讓高分子氟矽撥水劑乾燥，完成撥水鍍膜分子鍵結結構。
  - 再用擦乾後微淨的超細纖維布擦拭透亮即可。
specs:
  capacity: 120ml
  origin: 台灣
  ingredients: IPA醇類、高分子氟矽烷化合物
  other:
    - 品名：鐵甲武士 爆撥雨高分子氟矽撥水劑
    - 保存期限：6年
safety: |-
  - 皮膚過敏者或長時間使用者請戴保護手套。
  - 不慎誤食，請立即送醫。
  - 請避免兒童接觸，若不慎接觸到眼睛，請以大量清水沖洗並立即就醫。
  - 玻璃專用，請欲於非玻璃以外的材質表面。
  - 請勿於太陽直射或高溫的環境下操作。
  - 想清除本產品效果，請使用含玻璃清潔劑的美容產品。
