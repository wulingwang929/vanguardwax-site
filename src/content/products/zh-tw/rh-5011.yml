name: CUT 強力玻璃油膜劑
tagline: 採用德國超微分子micro-silica強效配方，深度清潔
description: "- 採用德國超微分子micro-silica強效配方，深度清潔，輕易消除玻璃上附著的油膜、蟲屍、鳥糞等汙垢，並使玻璃清晰透徹，減少雨刷的磨耗，防止異音及跳動。"
usageSteps:
  - 將擋風玻璃表面泥沙、灰塵洗乾淨。
  - 把油膜CUT適量倒在專用海綿上，稍加用力以畫圓的方式進行研磨除垢。
  - 除垢中玻璃呈現均勻霧化狀，再以清水沖洗乾淨並擦乾即可。
  - 適合用於汽車玻璃、浴室玻璃、櫥窗玻璃等……。
specs:
  capacity: 160ml
