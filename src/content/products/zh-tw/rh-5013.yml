name: OUT 無形雨刷撥水劑
tagline: 採最先進高分子填膜技術，簡單的塗擦就可形成透徹光滑的撥水塗層，就像無形雨刷一樣
description: "- 採最先進高分子填膜技術，簡單的塗擦就可形成透徹光滑的撥水塗層，就像無形雨刷一樣，雨中車速50km以上雨珠立即飛走，大幅提升雨天視野清晰。"
usageSteps:
  - 使用前，先用油膜清除劑清潔玻璃表面，並完全擦乾。
  - 倒適量潑水劑於專用海綿上，以井字工法交疊擦拭，均勻塗滿玻璃表面。
  - 等待5~8分鐘讓潑水劑乾燥，完成撥水鍵結結構原理。
  - 再用微濕的纖維布擦拭透亮為止。
