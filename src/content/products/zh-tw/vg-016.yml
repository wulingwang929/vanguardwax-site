name: 鉑金鏡面蠟 全車系
tagline: 天然棕櫚配方
description: |-
  - 天然棕櫚配方
  - 超高抗污耐久保護，挑戰鍍膜的極限耐久
  - 耐清洗、抗UV、抗氧化防止褪色
  - 保有高光亮度，完美撥水效果保護
usageSteps:
  - 先將車身徹底洗淨後，將車身擦拭乾燥。
  - 用上蠟海綿沾上少許蠟，用劃圓的方式均勻塗佈上蠟。
  - 用乾淨柔軟的超細纖維布，擦拭光亮呈現鏡面效果。
  - 溫度過高的環境會影響打蠟，應保持鈑金冷卻的狀態下，能更容易作業。
  - 鈑金溫度過高時，一次操作一片鈑金，下蠟後再塗另一片，以免過乾不易下蠟。
specs:
  capacity: 200g
  origin: 台灣KYOEI實驗室
  ingredients: 最高級美容蠟、樹脂、矽利光、溶劑等
  other:
