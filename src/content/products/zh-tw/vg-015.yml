name: 晶鑽鍍膜蠟 全車系
tagline: 獨家釉蠟封膜技術
description: |-
  - 獨家釉蠟封膜技術
  - 高分子釉配方，能滲透漆孔形成保護膜
  - 可去除刮痕、細紋、太陽紋
  - 耐清洗、抗UV、抗氧化防止褪色
  - 恢復漆面平整光滑，形成鏡面般保護效果
usageSteps:
  - 先將車身徹底洗淨後，將車身擦拭乾燥。
  - 用上蠟海綿沾上少許蠟，用劃圓的方式均勻塗佈上蠟。
  - 用乾淨柔軟的超細纖維布，擦拭光亮呈現鏡面效果。
  - 溫度過高的環境會影響打蠟，應保持鈑金冷卻的狀態下，能更容易作業。
  - 鈑金溫度過高時，一次操作一片鈑金，下蠟後再塗另一片，以免過乾不易下蠟。
specs:
  capacity: 200g
  origin: 台灣KYOEI實驗室
  ingredients: 最高級美容蠟、樹脂、矽利光、溶劑等
  other:
    - 保存期限：10年
safety: |-
  - 請在通風陰涼處使用與存放。
  - 皮膚過敏者或長時間使用者請戴保護手套。
  - 不慎誤食不要催吐，並立即就醫。
  - 請按照環保回收分類丟棄。
  - 請存放於兒童不易拿取之處。
