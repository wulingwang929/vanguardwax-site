description: |-
  - 能快速在車身表面上產生潑水效果，並有增艷、亮光的作用。
  - 適用於快速車漆養護與車漆鍍膜後的日常養護劑。。
  - 採用最新精煉氟素技術，可延長保護持續力。
  - 除了車漆使用外同時也能作用於玻璃上，作為快速成膜的潑水劑使用。
  - 消光車漆也可使用。
usageSteps:
  - 按照正常程序洗車後不用擦乾。
  - 全車噴上科技水鍍膜(包括玻璃)。
  - 再用清水澆淋全車，立即形成潑水亮光鍍膜效果。
  - 最後再將全車擦乾即可。
