description: |-
  - 搭配打蠟機使用的6吋除油膜盤
  - 使用魔鬼氈黏貼，可快速貼合上蠟盤
  - 特殊無紡材質耐用不易破損
  - 適用於各式氣動/電動打蠟機
  - 搭配油膜去除劑→歸零膏，油膜去除超有效
  - 搭配打蠟機→KT-W無線打蠟機，油膜去除超省力
usageSteps:
  - 使用前請確保汽車擋風玻璃已洗淨，避免灰塵髒污刮傷玻璃。
  - 請在玻璃微濕的狀態下使用。
  - 可先用清水將除油膜無紡材質面沾濕再貼合至上蠟盤。
  - 除完油膜的擋風玻璃屬於「完全親水」，如需雨水飛走效果請搭配「撥雨劑」。
  - 【用途】可用於汽車前後擋風玻璃、側邊玻璃、浴室玻璃等。
specs:
