safety: |-
  - 使用完畢請用中性洗劑搭配清水沖洗乾淨，並放置陰涼處陰乾。
  - 禁止使用於玻璃以外材質，避免造成損害。
  - 打蠟機為高速運轉機器，請務必將綿片確實貼合再使用。
  - 請存放於兒童不意拿取之處。
  - 綿片屬於消耗品，使用過一陣子需丟棄，避免產生刮痕細紋。
