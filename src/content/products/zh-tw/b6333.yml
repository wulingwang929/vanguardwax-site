category: clay-bar
brand: CLAY-U
name: 可力優 魔泥磁土潤滑液
tagline: 完美去除車身烤漆顆粒
description: |-
  - 完美去除車身烤漆顆粒。
  - 使漆面恢復至平滑。
  - 做為鍍膜前的深層清潔。
  - 讓上蠟與鍍膜效果更持久。
  - 取代清水，滑順度與去污性更升級。
  - 簡單快速將車漆上的附著物去除。
  - 最安全、有效的鐵粉去除組。
  - 讓清潔車漆髒污變得更簡單。
usageSteps:
  - 愛車徹底洗淨後不需擦乾。
  - 將超魔力魔泥清潔潤滑液，直接噴在車身烤漆或掌上型魔泥磁土上。
  - 利用潤滑液降低摩擦，將掌上型魔泥磁土在車漆表面來回輕推
  - 操作完畢後請用清水沖洗乾淨，最後再使用超細纖維布擦乾
  - ※建議一次操作一片烤漆，以免潤滑液乾燥在烤漆與玻璃上。
specs:
  capacity: 300ml
  origin: 台灣
  ingredients: 陰離子表面活性劑、非離子表面活性劑、甘油、純水
  other:
    - 保存期限：6年
safety: |-
  - 使用後請將掌上型魔泥磁土清潔乾淨，並放置於陰涼通風處，勿放置於高溫或陽光直射處。
  - 請避免兒童接觸，若不慎接觸到眼睛，請以大量清水沖洗並立即就醫。
  - 不慎誤食者請勿催吐，並立即就醫。
  - 長時間使用與皮膚容易過敏者，使用時請戴保護手套。
  - 請勿讓魔泥清潔潤滑液乾燥於烤漆或玻璃上，以免產生污痕。
  - 操作前請務必確認漆面及掌上型魔泥磁土的乾淨，勿施力過大以免產生細紋。
  - 請勿與含有溶劑類的化工品一起操作，如柏油去除劑、鐵粉去除劑與漆面還原劑。
  - 若掌上型魔泥磁土已會沾附於車漆上，請勿再繼續操作。
