name: 黏扣式偏心輪打臘機 2050
tagline: 採用人體工學設計，操作方便
description: |-
  - 採用人體工學設計，操作方便。
  - 強勁馬達提供隨機運轉軌跡，可深度清潔和拋光。
  - 超靜音、壽命長、輕巧設計便於攜帶。
  - 採用110V 家用電源。
  - 本產品均適用6-8吋魔鬼氈打蠟配件。
usageSteps:
  - 讓打蠟機黏扣面朝上，黏上乾淨的通用海綿盤，確保海綿盤下方魔鬼氈黏緊，使海綿盤不會從轉盤上脫落，並且海綿盤表面須平整。
  - 使用適量的優質蠟品塗在海綿上，並在海綿的表面均勻地鋪開。
  - 先從汽車上大而平整的表面(如汽車前後蓋、頂蓬與側面)開始打蠟，採用大範圍交叉的打蠟動作。
  - 切勿對打蠟機施加壓力，打蠟機在自重下運轉，無需施壓便可實現最佳的打蠟效果。
  - 對於難以作業的區域(如車門手把周圍、後照鏡、擋泥板下方等)，請改用手工打蠟的方式操作。
  - 最後，換上乾淨的超細纖維海綿，以當初上蠟相同的順序去完成下蠟拋光工作。
