safety: |-
  - 打蠟海綿可用少量的洗滌劑在冷水中清洗。不過為了延長棉盤的使用壽命，建議採用手洗並放置空氣中自然晾乾。
  - 不用時，請卸下打蠟海綿，並將打蠟機倒立放置，以使轉盤乾燥及保持原來的形狀，進而延長轉盤的使用壽命。
  - 請用清潔擦拭布，保養打蠟機主體，勿將打蠟機的任何部分侵入液體中。
  - 若打蠟機需要修理請用相同的零件更換。
  - 本機器屬間歇使用型工具，不可長時間連續使用。
  - 當清潔或保養結束後，請先將插頭從電源插座上移除。
  警告：
  - 當使用電動工具時，應遵守基本的安全操作規範，以減少火災、電擊及人身傷害等意外事故發生。
  - 在更換打蠟機海綿時，請務必關閉電源，在啟動與停止打蠟機時，需將轉盤靠在汽車表面上。
