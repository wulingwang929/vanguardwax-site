name: MAGIC-Q 汽車擋風玻璃修補組
tagline: 強效且快速修補各種擋風玻璃碰傷裂縫， 停止裂縫擴散修補後幾乎看不見傷痕
description: "- 強效且快速修補各種擋風玻璃碰傷裂縫， 停止裂縫擴散修補後幾乎看不見傷痕。"
usageSteps:
  - 先清理髒污與玻璃碎片。
  - 固定架中心點須對準玻璃撞擊點並緊壓吸盤。
  - 接著將六角形螺旋式壓力筒旋緊，並確定其有牢固緊貼在玻璃上。
  - 擠5~6滴修補液至壓力筒內，再將壓力棒塞進去旋緊。
  - 等待約3分鐘後，先將壓力棒取出，接著再取出壓力筒。
  - 接著取下固定架，並將殘留的修補液擦拭乾淨。
  - 在修補處表面滴下一滴修補液，並覆蓋上治理膠片。
  - 在陽光底下照射3~5分鐘後，去除治理膠片並拿出刀片與玻璃呈90度刮除硬化的修補樹脂。
specs:
  capacity: 1.5g
  origin: 台灣
  other:
    - 品名：MAGIC-Q汽車擋風玻璃修補組
    - 內容物：固定架x1、六角形螺旋式壓力筒 8.0 mm 壓力筒橡皮、六角形螺旋式壓力棒x1、刀片x1、修補劑(1.5g)x1、使用說明書x1、治理膠片x10
    - 箱入數（小箱／大箱）：6/120
safety: |-
  - 使用前請詳閱說明書，確認每一個步驟後再開始施工。
  - 牛眼型、星狀形、複合型、牛眼+星狀形裂縫損害範圍不超過一英吋長直徑(2.54mm)。
  - 裂縫不超過12英吋(30cm)。
  - 符合以上情況即適合使用本產品。
  - 修理時請在陰涼處使用，修理完成可在陽光下照射3-5分鐘(可用UV紫外線燈具替代)。
  - 避免接觸眼睛，皮膚和衣物，如有碰觸請以大量清水沖洗。
