safety: |-
  - 嚴禁與石油系清潔劑混合使用(如柏油清潔劑或美容乳蠟)。
  - 請勿過度用力擦拭車漆表面，容易產生擦痕。
  - 如已產生擦痕，請上美容細蠟即可消除。
  - 嚴禁長時間置於40℃以上高溫處。
  - 避免在鈑金處於高溫下施工。
  - 膠面嚴重污染髒污，請立即更換新品，以免刮傷車漆。
  - 使用後擰乾，放置於專用泡殼收納。
