name: 可力優 魔泥磁土綿盤 氣動打蠟機專用
tagline: 奈米級特殊成分，巧妙的與圓盤海綿結合，再配合氣動打臘機，省時不費力
description: |-
  - 奈米級特殊成分，巧妙的與圓盤海綿結合，再配合氣動打臘機，省時不費力，將產品效果發揮淋漓盡致，面積大、速度快！
  - 不可思議的清潔效果，輕易的去除長時間堆積在車漆上的污粒、鐵粉、工業落塵等污染，車漆表面瞬間變的平滑柔順。
usageSteps:
  - 將車身的灰塵、泥沙徹底洗淨，不須擦乾。
  - 將可力優美容磁土圓盤用清水或洗車液充分浸濕，安裝在氣動打蠟機，不需費力的推抹全車(包括玻璃)。勿過度施壓。
  - 使用中隨時將圓盤取下浸濕，過水洗滌後繼續使用，可避免汙粒刮傷漆面。
  - 建議使用轉數600轉~1200轉，請遵循氣動打蠟機的適當高轉數建議，確保不會損傷漆面。
  - 全車推抹乾淨後，再用清水將車身沖洗一遍即可。
  - 若有不正常擦傷或白斑，上蠟後即可消除。
  - 車身擦拭乾燥後，可進行上蠟作業。
