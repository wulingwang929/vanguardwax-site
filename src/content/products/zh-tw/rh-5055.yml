sku: RH-5055
barcode: "4717954992225"
category: car-wash
brand: VANGUARD
name: 超級防護 鋼圈&輪胎清潔劑
tagline: 【防護升級，減少粉塵附著】溫和配方針對鋼圈清潔所研製的專用清潔劑
description: |-
  - 【防護升級，減少粉塵附著】溫和配方針對鋼圈清潔所研製的專用清潔劑，可迅速瓦解鋼圈上的髒污及煞車來令片產生的頑固粉塵，恢復原廠輪圈的亮度。
  - 【溫和配方，不傷材質】配方溫和，各類鋼圈與輪胎皆可同時清潔，潔淨同時守護光澤。
  - 【強效分解，恢復亮澤】高效鋼圈清潔力，滲透溶解煞車粉塵與頑固髒汙，適用於鉻、鋁、鎂等多種材質。深層去污同時減少粉塵積聚，保持鋼圈長效潔淨與亮澤，讓愛車細節更出色。
usageSteps:
  - 將鋼圈清潔劑均勻地噴灑於已沖溼的輪圈死角與髒污處。
  - 配合鋼圈清潔刷，徹底刷洗。
  - 再用清水沖乾淨即可。(若有嚴重髒污，請重覆以上動作)
  - 為確實完全清潔，可將四個輪圈轉動180°檢視是否測底刷淨。
specs:
  capacity: 473ml
  origin: 台灣
  ingredients: 特殊界面活性劑、乳酸乙脂、精煉水
  other:
    - 適用範圍：鋼圈、電鍍鋼圈、鎂鋁鋼圈、橡膠輪胎（使用前請於不明顯處小量測試後再進行使用，如發現有問題請勿繼續使用。）
safety: |-
  - 請在通風陰涼處使用並讓輪圈及煞車碟盤溫度徹底降溫，勿在高溫下進行清洗，勿將清潔劑噴塗於過熱或乾燥的輪圈上。
  - 請一次清洗一個輪圈，同時清洗可能使清潔劑過度乾燥留下痕跡。
  - 如有上列過度乾燥情形只需用清水洗淨即可。
  - 皮膚敏感者請戴手套，不慎入口、眼請用大量清水沖洗並立即就醫。
