safety: |-
  - 使用後若有髒汙，請以傳統肥皂或中性清潔劑清洗。
  - 請勿使用柔軟劑，避免破壞纖維組織影響吸水功能。
  - 使用漂白水及烘乾機，可能會造成部份縮水。
  - 表面砂石或灰塵過多時應先清除，避免造成刮痕。
