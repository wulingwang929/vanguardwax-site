name: 超人氣 羊毛拋光盤5吋
tagline: 羊毛拋光盤專為漆面美容護理及漆面極致鏡面拋亮設計，細緻羊毛製成，高效且柔軟滑順
description: "- 羊毛拋光盤專為漆面美容護理及漆面極致鏡面拋亮設計，細緻羊毛製成，高效且柔軟滑順，拋光不會刮傷物件表面。"
usageSteps:
  - 將羊毛拋光盤浸濕，安裝在研磨機上，空轉5秒鐘，將多餘水分甩乾。
  - 把研磨劑搖勻，少許倒在羊毛拋光盤上，用拋光盤在漆面上塗抹均勻。
  - 對於車身邊角請採用手工方式拋光，用乾淨的纖維布沾拋光劑拋光，注意邊角及棱角，不要用力過度，因為這些地方的烤漆較薄。
  - 漆面拋光後，用乾淨毛巾將整車清潔乾淨。
