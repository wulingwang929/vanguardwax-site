tagline: 適用性強，消光漆車和一般漆車及全部車色都可適用之汽車美容蠟
description: |-
  - 適用性強，消光漆車和一般漆車及全部車色都可適用之汽車美容蠟。
  - 含紫外線吸收劑，可防止紫外線照射並避免車漆顏色改變、劣化，使車漆長保如新，不易變色。
  - 具有深度光輝、堅美的薄膜，遠勝一般固體汽車蠟、軟蠟、水蠟等。
  - 打蠟擦拭輕鬆、打蠟作業用量極少，產生透明薄膜，好推也好擦，具優越之耐久性、撥水性、耐候性。
  - 暢銷30餘年，能創造出最深度的光輝，堅美透明的薄膜，遠勝一般車蠟。
  - 特殊的紫外線吸收劑能使車漆長保如新，不易變色，光輝創造之極點，適合新車、高級車用。
usageSteps:
  - 先將車身徹底洗淨並擦乾。
  - 用上蠟海綿沾取少許乳蠟，用重疊畫圓的方式，一次選取一個區塊塗佈上蠟。
  - 用乾淨柔軟的超細纖維布，擦拭光亮呈鏡面效果即可。
