category: glass-care
brand: VANGUARD
name: 特速零油膜擊退去除劑
tagline: 獨家超微分子潔淨配方，徹底清除玻璃上的污垢，且不傷玻璃表層
description: |-
  - 獨家超微分子潔淨配方，徹底清除玻璃上的污垢，且不傷玻璃表層。
  - 讓您享受更清晰且透徹的視野，擁有更安全的行車視線。
  - 能使用在汽車玻璃、浴室玻璃、櫥窗玻璃上。
  - 包裝內附【魔力海綿x2，超細纖維布x1】。
usageSteps:
  - 先將擋風玻璃清洗乾淨。
  - 海綿沾取適量的特速零，於微濕的玻璃上以稍加用力畫圓的方式進行研磨除垢。
  - 待數分鐘後，玻璃成均勻霧狀，即可用超細纖維布以清水沖淨。
  - 最後使用超細纖維布將擋風玻璃擦乾即可。
specs:
  capacity: 270g
  origin: 台灣
  ingredients: 氧化鈰、氧化鋁、微米陶土、精煉水
  other:
    - 保存期限：6年
    - 包裝內含：魔力海綿x2，超細纖維布x1
safety: |-
  - 皮膚過敏者或長時間使用者請戴保護手套。
  - 不慎誤食，請立即送醫。
  - 請避免兒童接觸，若不慎接觸到眼睛，請以大量清水沖洗並立即就醫。
  - 玻璃專用，請勿用於非玻璃以外的材質表面。
  - 請勿於太陽直射或高溫的環境下操作。
  - 因每台車況與個人使用劑量不同，呈現效果請依實際操作為主。
