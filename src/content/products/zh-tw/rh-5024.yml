    - 保存期限：6年
safety: |-
  - 貼合表面若殘留油脂或髒汙，可能會造成黏著失敗，請務必徹底清潔。
  - 請在通風陰涼處使用。
  - 皮膚過敏者或長時間使用者請戴保護手套。
  - 室內常溫存放，置於兒童不易拿取之處。
  - 不慎碰觸眼睛會有刺激性，立即用大量清水沖洗，並立即就醫。
  - 儘可能一次用完，外包裝按照環保分類丟棄。
