name: 超級防護 石墨烯洗車液 1:500
tagline: 【豐富泡沫，深層潔淨】奈米石墨烯結合棕櫚光澤蠟（1:500高倍濃縮）
description: |-
  - 【豐富泡沫，深層潔淨】奈米石墨烯結合棕櫚光澤蠟（1:500高倍濃縮），高泡沫中性配方，細緻綿密的泡沫完整包覆灰塵，降低灰塵砂礫和車漆的直接摩擦，使用後車漆疏水，絲滑感光澤亮麗。
  - 【滑順潔淨，不留殘漬】添加石墨烯助劑，強效洗淨且易沖洗，迅速帶走灰塵與污垢，讓車漆表面光滑透亮沖洗無殘留。
  - 【光澤防護層】石墨烯成分結合濃縮棕櫚強化鍍膜效果，為車漆形成光澤與防護層，增強撥水性，洗後即展現耀眼光澤。
usageSteps:
  - 1:500高濃縮配比與清水搭配攪拌發泡即可開始使用。
  - 用海綿沾取大量泡沫清洗全車。
  - 用清水沖洗乾淨並將全車擦乾，可快速得到光澤潑水效果。
specs:
  capacity: 946ml
  origin: 台灣
  ingredients: 奈米石墨烯、濃縮棕櫚成分、界面活性劑、精煉水
safety: |-
  - 每次使用後請徹底清洗海棉、擦車布及水桶，避免灰塵二次刮傷車身。
  - 皮膚敏感者請戴手套，不慎入口、眼請用大量清水沖洗並立即就醫。
  - 請按照環保回收分類丟棄。
