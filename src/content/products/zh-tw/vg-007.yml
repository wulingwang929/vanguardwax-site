category: car-wax
brand: VANGUARD
name: 無雙超級防護乳蠟
tagline: 使用業界最高規格與等級棕櫚蠟
description: |-
  - 使用業界最高規格與等級棕櫚蠟。
  - 乳蠟延展性極佳的特性，擁有最高漆面滑順感。
  - 添加紫外線吸收劑，延緩車漆因陽光照射而變質劣化。
  - 防止灰塵、髒污、油膜、蟲屍或水珠附著於車漆上。
usageSteps:
  - 上蠟前，先將全車附著的灰塵與髒污徹底沖洗乾淨並擦乾。
  - 使用上蠟海綿沾取適量防護乳蠟，均勻塗抹於車漆表面，以重疊畫圓的方式，一次處理一個區塊。
  - 操作完畢後，用乾淨的超細纖維布下蠟擦拭乾淨，呈現鏡面光亮效果。
  - 若需加強漆面光亮效果，無雙乳蠟擦拭乾淨後，再上一層”封體劑”，呈現堆疊光澤。
specs:
  capacity: 300ml
  origin: 台灣
  ingredients: 棕櫚蠟、聚合纖維密封劑、增豔劑、溶劑、乳化劑、香精
safety: |-
  - 請在通風陰涼處使用與存放。
  - 皮膚過敏者或長時間使用者請戴保護手套施工。
  - 請使用最輕柔的操作力道。
  - 棕櫚蠟品上蠟後請確實下蠟，避免油影產生。
  - 請放置兒童不易拿取處。
  - 不慎誤食不要催吐，並立即就醫。
  - 請按照環保回收分類丟棄。
  - 下蠟用的超細纖維布勿與其他用途的超細纖維布混用，以免造成車漆損傷。
  - 內附乳液頭請於開封後替換鎖緊，並將產品直立式存放，避免產品因長期倒放液體從孔隙中流出與藥劑揮發。
