    - 保存期限：正常使用可永久保存
safety: |-
  - 專業洗滌劑壓力起泡噴霧器，盛裝其他溶劑或做其他用途使用。
  - 細部零件請勿自行拆裝，並禁止兒童放入口中把玩。
  - 使用時請勿對眼睛直接噴射。
  - 廢棄物拋棄請按資源回收分類處理。
