name: 抗強酸鹼噴霧器
tagline: 噴霧狀或直線狀噴射
description: |-
  - 噴霧狀或直線狀噴射。
  - 304不鏽鋼打氣桿。
  - 創新自動開關設計。
  - 錐形瓶體減輕每次壓氣次數與手感。
  - 適用強酸鹼洗潔精及部分化學溶劑。
usageSteps:
  - 注入清水及洗潔劑，總容量建議約1500ml。
  - 連續按壓打氣桿，注入空氣壓力直到飽和壓不下去。
  - 按壓開關，對準需噴灑物品就可直接使用。
  - 如需長時間使用，可按壓連續開關扣。
specs:
  capacity: 1.8L
  origin: 瓶身-CHINA / 氣壓幫浦-台灣
  boxQty: 12
  ingredients: 304不銹鋼、聚乙烯、聚丙樹脂、鐵氟龍材料、橡膠材料
  other:
