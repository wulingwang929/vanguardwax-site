name: 4S 極光鍍膜蠟
tagline: 極光鍍膜絕對防護
description: |-
  - 極光鍍膜絕對防護
  - 超強撥水性，不沾汙垢不惹塵
  - 全車色對應，各種車色均可使用
  - 簡單快速好操作，上蠟、下蠟不費力
  - 具優越之耐久性、撥水性、耐候性
usageSteps:
  - 先將車身徹底洗淨後，將車身擦拭乾燥。
  - 用上蠟海綿沾上少許蠟，用劃圓的方式均勻塗佈上蠟。
  - 用乾淨柔軟的超細纖維布，擦拭光亮呈現鏡面效果。
  - 溫度過高的環境會影響打蠟，應保持鈑金冷卻的狀態下，能更容易作業。
  - 鈑金溫度過高時，一次操作一片鈑金，下蠟後再塗另一片，以免過乾不易下蠟。
specs:
  capacity: 300g
  origin: 台灣KYOEI實驗室
  ingredients: 巴西棕櫚蠟、高分子矽聚合物、溶劑、香精等
  other:
