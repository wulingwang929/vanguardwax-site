usageSteps:
  - 倒出適量極塑光塑料還原劑於海綿上。(如氧化嚴重，請先清潔表面再使用本劑)
  - 於塑件表面均勻塗佈置黑亮。
  - 以乾淨的布擦拭。
  - 塑件煥然一新，質感升級！
  - 【適用範圍】烤漆塑膠、保險桿、後視鏡、輪拱、側裙等塑膠材質
