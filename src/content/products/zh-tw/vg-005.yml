safety: |-
  - 避免用於汽車烤漆部分，如不慎沾染車漆，使用擦拭布擦拭乾淨即可。
  - 本產品為未烤漆之塑膠件設計配方，請勿用於車室內裝飾板。
  - 請在通風陰涼處使用與存放。
  - 皮膚過敏者或長時間使用者請戴保護手套。
  - 不慎誤食不要催吐，並立即就醫。
  - 請按照環保回收分類丟棄。
  - 開封後存放請將產品直立式存放，避免產品因長期倒放液體從孔隙中流出。
