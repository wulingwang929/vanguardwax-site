category: glass-care
brand: VANGUARD
name: 超級防護 石墨烯玻璃撥水鍍膜劑
tagline: 【強勁撥水，水珠飛散】石墨烯結合氟矽烷化合物配方，超導入特性
description: |-
  - 【強勁撥水，水珠飛散】石墨烯結合氟矽烷化合物配方，超導入特性，有效填補玻璃細微毛孔，迅速於玻璃表面形成耐久防護結構，提供卓越的撥水性、抗污性與抗油膜的鍍膜層。
  - 【隱形雨刷】超大110º水滴角，雨中車速達45KM以上時，雨珠立即從擋風玻璃飛走上，確保雨天行車視線清晰，安全無憂。
  - 【便利設計，輕鬆施作】搭載人體工學刷頭，輕鬆均勻塗佈，快速鍍膜無死角。藥劑不直接接觸雙手，操作更安心。
usageSteps:
  - 將擋風玻璃油膜徹底清除乾淨後並擦乾。
  - 輕壓瓶身讓藥劑浸濕刷頭，再將石墨烯撥水鍍膜劑均勻塗佈在玻璃上。
  - 等待藥劑乾燥成白霧狀態，即完成潑水鍍膜分子鍵結結構。
  - 再用擰乾後的超細纖維布擦拭，使擋風玻璃透亮即完成。
specs:
  capacity: 100ml
  origin: 台灣
  ingredients: 奈米液化石墨烯、特殊氟素，高分子氟矽烷化合物、IPA醇類
safety: |-
  - 如要清除本產品，請使用強效玻璃專用除油膜藥劑。
  - 請勿將商品倒放或側放，使用後請確定保持瓶口鎖緊，避免藥劑流出。
  - 請勿於太陽直射或高溫的環境下操作。
  - 皮膚敏感者請戴手套，不慎入口、眼請用大量清水沖洗並立即就醫。
