name: 砂石過濾網 (洗車桶用)
tagline: 特殊紋圈設計使隔離成效更佳，強韌耐沖刷、耐酸鹼、耐用性佳
description: |-
  - 特殊紋圈設計使隔離成效更佳，強韌耐沖刷、耐酸鹼、耐用性佳。
  - 將砂石隔離網置於桶內底端，可有效隔離砂石類髒污。
usageSteps:
  - 準備一個水桶並將砂石過濾網放置於桶內底端。
  - 把水加入桶內並高過於砂石過濾網。
  - 在水桶裡面直接清洗洗車海綿、刷子和毛巾，可有效避免砂石揚起，防止汽機車漆面被砂石刮傷。
