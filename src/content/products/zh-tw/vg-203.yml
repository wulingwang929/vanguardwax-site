brand: VANGUARD
name: 水動力高壓水槍
tagline: 六段灑水模式能有效清潔各種環境
description: |-
  - 六段灑水模式能有效清潔各種環境
  - 好握人體工學握柄設計
  - 贈槍頭橡膠套能夠有效保護噴頭且防滑
  - 按壓出水板機即可連續出水，按壓解除鈕即可斷水
  - 配備逆止快速接頭，中途更換拔取時水槍不須關水動作即可自動斷水，可自由的銜接不同快速接頭
  - 20公分伸縮加壓管，可以靈活伸展於各種場景
  - 配有清潔劑儲液槽，透過切換模式輕鬆達到皂化/清水模式
usageSteps:
  - 開始灑水時槍管延伸至最長位置。
  - 將清潔劑倒入清潔濟儲液槽。
  - 將逆止快速接頭連接，直接固定在水槍噴頭底部。
  - 在加入清潔劑之前，要先確保清潔劑/水切換開關處於"水位"時添加。
  - 將噴頭旋至希望灑水模式位置，噴頭頂部有指示箭頭以了解噴水模式。
  - 水槍可以噴射水或混和清潔劑噴射，這可以透過在槍身頂端的切換開關來改變。
  - 水槍開關須按壓出水板機聽到"卡搭"聲即可以使用(連續出水)，欲停水時，直接按灰色按鈕解除板機，水就會停止。
  - 可以搭配海綿與噴射水槍一起使用，對於清潔灰塵和污垢會有加分的效果。
  - 若要清洗清潔劑儲液槽，旋開儲液槽並加滿水，簡單噴灑水直到無泡沫感即可。
  - 本產品避免長期放置於陽光下直射。
  - 使用後，將水管推回原位並卸下快速接頭，把旋轉的噴頭對轉地面，切勿將噴頭對準臉部或其他人，最後槍管內的液體將會散去。
specs:
  origin: 台灣
  dimensions: 52cm*6cm*29cm
  other:
    - 材質：ABS、鐵氟龍止水環、PP
    - 重量：522g
safety: |-
  - 水柱強勁使用時禁止將水槍對準任何人及眼睛噴射。
  - 水槍不是玩具，不適宜作為玩具或其他用途，也不適合孩童單獨使用。
  - 請勿將洗車水槍長時間置於陽光直射下。
  - 要定期清潔噴嘴孔，以清除任何雜物。每次使用後都要確實用水清理清潔劑儲液槽。
  - 添加洗潔精前，請先閱讀洗潔精的安全標籤再注入水槍混合槽使用。
  - 切勿使用有毒化學物質、腐蝕性液體放置水槍內使用。
  - 洗車水槍僅能使用冷水操作。
  - 請勿直接對人拋擲，以免受傷。
  - 丟棄時請按環保回收規範回收，請勿燃燒。
  - 如作他用請審慎評估安全性。
  - 本包裝內未含(水管)與(水龍頭端的奶嘴接頭)與(水龍頭轉接頭)。
