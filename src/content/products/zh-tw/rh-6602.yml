tagline: 扇形噴射起泡泡沫設計，有效減少清潔劑使用量
description: |-
  - 扇形噴射起泡泡沫設計，有效減少清潔劑使用量。
  - 創新自動開關設計。
  - 錐形瓶體減輕每次壓氣次數與手感。
  - 適用強酸鹼洗潔精及部分化學溶劑。
usageSteps:
  - 注入水及清潔劑，總容量建議約1500ml。
  - 連續按壓打氣桿，注入空氣壓力直到氣壓飽和壓不下去。
  - 按壓開關，對準需噴灑物品就可直接使用。
  - 如需長時間使用，可按壓連續開關扣。
