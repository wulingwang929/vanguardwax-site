name: 美白增豔乳蠟
tagline: 快速解決細紋、陳年污垢與色澤黯淡等車漆問題
description: |-
  - 快速解決細紋、陳年污垢與色澤黯淡等車漆問題
  - 提升潑水效果疏水疏油性，有效減少污漬附著度
  - 深撫平車漆細孔，提升漆面滑順並還原色澤
  - 深層處理淺層水痕、車漆氧化及泛黃髒污
  - 特殊清潔成分不含研磨劑，絕不傷金油與車漆
  - 深提升保護蠟附著效果，達到更持久的保護力
  - 包裝內附【超細擦拭布】一條
usageSteps:
  - 全車徹底洗淨並擦乾。
  - 使用海綿沾取美白蠟，均於塗抹於車漆表面。
  - 以重疊畫圓的方式，一次處理一個區域。
  - 操作完畢後以乾淨的布下蠟擦拭乾淨，即能恢復愛車色澤與亮度。
  - 車漆煥白增豔質感升級，可再上一層保護蠟防護車漆呈堆疊光澤效果。
specs:
  capacity: 300ml
  origin: 臺灣
  ingredients: 棕櫚蠟、聚合矽油、特殊清潔粉末、溶劑、乳化劑、香精
  other:
    - 保存期限：6年
safety: |-
  - 請在通風陰涼處使用與存放。
  - 皮膚過敏者或長時間使用者請戴保護手套施工。
  - 請使用最輕柔的操作力道。
  - 對於缺陷較多處，請增加塗抹量，並適度增加塗抹壓力，以達到完美的效果。
  - 請放置兒童不易拿取處。
  - 不慎誤食不要催吐，並立即就醫。
  - 請按照環保回收分類丟棄。
