tagline: 瓷光釉蠟採用高單位NO.1最高等級巴西棕櫚蠟原料為基底，可使車漆保持長久光澤
description: |-
  - 瓷光釉蠟採用高單位NO.1最高等級巴西棕櫚蠟原料為基底，可使車漆保持長久光澤，效果超越傳統車蠟的兩倍！
  - 獨家配方高分子透明交織狀聚合纖維封膜劑，它特有的化學分子結構，可在車漆表面形成一層堅硬、光澤飽和的封閉性保護膜，像瓷器般的光澤，為愛車提供長達120天以上的多重保護。
  - 不可思議的超強潑水、防汙效果，能承受惡劣的酸雨侵蝕以及強烈陽光、紫外線的輻射傷害，而且具有填平修飾細小劃痕的功能，戶外停車保護漆面免受損害。
  - 蠟質精純，不含研磨劑，對於未塗裝的黑色塑膠件也可一併擦拭，不會留下白色殘蠟粉末。
  - 玩家、車友皆以此蠟做為保養愛車最高標準。
usageSteps:
  - 先將全車徹底洗淨然後擦乾。
  - 用上蠟海綿沾取少許乳蠟，用重疊畫圓的方式，一次選取一個區塊塗佈上蠟。
  - 用乾淨柔軟的超細纖維布，擦拭光亮呈鏡面效果即可。
  - 如車漆表面過熱，呈現層疊蠟痕時，請用微溼的超細纖維布擦拭即可。
