category: car-wax
brand: VANGUARD
name: 超級防護 石墨烯橡膠塑件增色還原劑
tagline: 【深層滲透，恢復原色】奈米石墨烯結合有機矽聚合物，高效滲透型配方
description: |-
  - 【深層滲透，恢復原色】奈米石墨烯結合有機矽聚合物，高效滲透型配方，重現如新車般的塑件原始色澤，告別泛白與老化痕跡，更顯新車般的高貴亮眼。
  - 【撥水抗污，長效保護】石墨烯鍍膜科技強化塑件防護力，可防止紫外線傷害及氧化，擁有優異的疏水疏油特性，減少灰塵與污漬附著，維持潔淨光亮。
  - 【輕盈快乾不油膩】獨特速乾配方，延展性強，快速還原塑件本色，塗抹後形成持久成膜，不油不膩，適合無烤漆保桿、輪弧、引擎室等全車塑膠、橡膠材質。
usageSteps:
  - 先清潔欲塗佈塑料還原劑的區塊。(如氧化嚴重請先用魔術綿清潔表面氧化層再使用本劑)
  - 沾取適量塑件增色還原劑於塑件表面均勻塗佈至黑亮。
  - 如遇老化及白霧特別嚴重的區塊，可重複多次。
specs:
  capacity: 473ml
  origin: 台灣
  ingredients: 奈米石墨烯、有機矽聚合物、抗臭氧劑、香精
safety: |-
  - 避免用於汽車烤漆部分，如不慎沾染車漆，使用擦拭布擦拭乾淨即可。
  - 本產品為未烤漆之塑膠件設計配方，請勿用於車室內裝飾板。
  - 請在通風陰涼處使用，避免陽光直射或高溫環境作業。
  - 皮膚敏感者請戴手套，不慎入口、眼請用大量清水沖洗並立即就醫。
