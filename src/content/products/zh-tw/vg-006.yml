brand: VANGUARD
name: 超級氟素玻璃鍍膜巾
tagline: 先進超級氟素填膜技術
description: |-
  - 先進超級氟素填膜技術
  - 讓前擋玻璃充滿透明撥水塗層
  - 兩倍的高分子氟素配方
  - 雨滴立刻被彈飛
  - 單入鍍膜巾，攜帶好方便
  - 濕紙巾款式，操作玻璃無死角
  - 單獨包裝使用時不怕交叉汙染
  - 不用10分鐘即可完成操作
usageSteps:
  - 徹底清除擋風玻璃的油膜，並完全擦乾。
  - 首選使用【VANGUARD 油膜去除劑玻璃重垢歸零膏】。
  - 正確去除玻璃上油膜後，將單入玻璃鍍膜巾撕開。
  - 立即將超級氟素玻璃鍍膜巾均勻塗佈在玻璃上。
  - 以直線雙向均勻塗抹在擋風玻璃上。
  - 約五分鐘，讓超級氟素潑水劑乾燥，即可完成潑水鍍膜分子鍵結結構。
  - 最後使用擰乾後的超細纖維布擦拭，使擋風玻璃透亮即完成。
  - 【用量預估】超級氟素玻璃鍍膜巾僅能一次性使用，鍍膜藥劑乾掉後無法繼續使用，實際使用因每片擋風玻璃大小與施做速度不同，以當下操作為主。
specs:
  capacity: 200 x 230 mm
  origin: 台灣-KYOEI化學實驗室
  dimensions: 200x230mm
  ingredients: IPA醇類、特殊氟素、高分子氟矽烷化合物
  other:
    - 保存期限：6年
safety: |-
  - 皮膚過敏者或長時間使用者請戴保護手套。
  - 不慎誤食，請立即送醫。
  - 請避免兒童接觸，若不慎接觸到眼睛，請以大量清水沖洗並立即就醫。
  - 玻璃專用，請欲於非玻璃以外的材質表面。
  - 請勿於太陽直射或高溫的環境下操作。
  - 清除本產品效果，請使用玻璃專用研磨劑。
  - 因每台車況與個人使用劑量不同，呈現效果請依實際操作為主。
