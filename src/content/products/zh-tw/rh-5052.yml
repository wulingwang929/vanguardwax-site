category: car-wash
brand: VANGUARD
name: 超級防護 石墨烯輪胎煥新鍍膜膏
tagline: 【深邃黑亮，極致防護】奈米石墨烯結合聚酯化合物配方，最新水性樹脂完全無溶劑
description: |-
  - 【深邃黑亮，極致防護】奈米石墨烯結合聚酯化合物配方，最新水性樹脂完全無溶劑，具有極強的滲透附著力，塑造黑潤光澤亮感，有效抵禦紫外線與龜裂，維持輪胎彈性。
  - 【易吸收不噴甩】石墨烯高滲透樹脂迅速滲透輪胎表面，形成穩固保護層，減少灰塵附著與殘液噴甩，氣味芳香，保持輪胎潔淨如新。
  - 【輪胎專用】橡膠輪胎增強黑亮效果，同時提供持久防護，降低老化與龜裂風險，增加行車安全，延長輪胎使用壽命，長保如新。
usageSteps:
  - 使用前請用輪胎清潔劑刷洗輪胎壁，並確保表面乾燥。
  - 取適量產品，使用輪胎刷或海綿，分次塗抹於輪胎側壁上。
  - 均勻塗佈後靜置數分鐘，待吸收後即完成作業。
specs:
  capacity: 473ml
  origin: 台灣
  ingredients: 奈米石墨烯、聚脂化合物、水性矽樹脂、抗臭氧劑、香精
safety: |-
  - 請勿塗抹於輪胎胎紋面，以免打滑影響行車安全。
  - 請在通風陰涼處使用，避免陽光直射或高溫環境作業。
  - 皮膚敏感者請戴手套，不慎入口、眼請用大量清水沖洗並立即就醫。
