brand: VANGUARD
name: 超級防護 石墨烯鍍膜車蠟 全車色系
tagline: 【石墨烯 X黃金棕櫚】奈米石墨烯分子結構融合頂級T1棕櫚蠟
description: |-
  - 【石墨烯 X黃金棕櫚】奈米石墨烯分子結構融合頂級T1棕櫚蠟，超導入特性鍍膜層更緊密、更耐久，帶來卓越的潑水性、抗污力與耐化學侵蝕能力，長效守護車漆光澤，讓愛車始終亮麗如新。
  - 【晶透鍍膜極致鏡面】不含任何研磨劑，卓越的填補修飾力，撫平細紋與瑕疵，打造宛如豪車級的高反射鏡面光澤，令車色更深邃動人。
  - 【輕鬆維護】110º水滴角強大的潑水鍍膜屏障，防止灰塵、油膜、蟲屍與水漬殘留，減少髒污與水痕形成，讓愛車保持璀璨光澤。
usageSteps:
  - 先將車身徹底洗淨後，將車身擦拭乾燥。
  - 用上蠟海綿沾上少許蠟，用劃圓的方式均勻塗佈上蠟。
  - 用乾淨柔軟的超細纖維布，擦拭光亮呈現鏡面效果。
  - 溫度過高的環境會影響打蠟，應保持鈑金冷卻的狀態下，能更容易作業。
specs:
  capacity: 150g
  origin: 台灣
  ingredients: 奈米石墨烯、最高等級T1棕櫚蠟，高分子聚合物、溶劑、香精
safety: |-
  - 請在通風陰涼處使用與存放。
  - 皮膚敏感者請戴手套，不慎入口、眼請用大量清水沖洗並立即就醫。
  - 請存放於兒童不易拿取之處。
