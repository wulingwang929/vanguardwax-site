description: |-
  - 藍色韌毛質地溫和堅韌
  - 紅色軟毛質地柔軟輕盈
  - 一柄兩刷頭，雙刷頭輕鬆擺定內外清潔
  - 快拆裝替換刷頭，高效率完成更換
  - 高韌度精緻細節刷，輕鬆處理細節處
  - 符合人體工學握柄，握感舒適耐用
  - 耐酸鹼、耐沖洗，適用於酸鹼性藥劑
  - 尾端開孔設計，吊掛收納不占空間
usageSteps:
  - 軟、紅毛刷頭：適合乾用清潔車內各個細節處。如：出風口/儀表板/座椅/中控臺/置物架/內裝把手。
  - 韌、藍毛刷頭：適合濕用清潔車身各個細節處。如：門把手/LOGO/標誌/門窗邊縫/大燈接縫/輪圈縫隙/擋風玻璃邊縫。
  - 輕鬆處理車內外細節，軟、韌刷頭都可搭配清潔液使用。
specs:
  origin: 中國(台灣監製)
  other:
    - 材質：刷頭 - PP混和開纖毛；刷柄 - PP
    - 保存期限：10年
safety: |-
  - 清洗後陰乾即可，避免日照直射。
  - 請放置於兒童無法拿取處。
  - 若不慎吞食，請立即就醫。
  - 請勿日曬或置於高溫處，並遠離火源。
  - 請勿直接對人拋擲，以免受傷。
  - 丟棄時請按環保回收規範回收，請勿燃燒。
  - 如作他用請審慎評估安全性。
