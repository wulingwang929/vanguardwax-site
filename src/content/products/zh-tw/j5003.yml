safety: |-
  - 以清水洗淨外，使用後若有髒汙，請以傳統肥皂或中性清潔劑清洗。
  - 請勿使用柔軟劑，避免破壞纖維組織影響吸水功效。
  - 如使用漂白水或烘乾機，則可能造成縮水。
  - 纖維布處於乾燥狀態時也可使用。
  - 使用前請確認布面是否有灰塵等異物附著。
  - 表面砂粒、灰塵過多時應先清除，以免造成刮痕。
